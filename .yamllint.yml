---
extends: default

rules:
  line-length:
    max: 120
    level: warning
  comments:
    min-spaces-from-content: 1
  comments-indentation: disable
  document-start: disable
  truthy:
    allowed-values: ["true", "false", "on", "off"]
  empty-lines: disable
  braces: disable
  octal-values: disable

ignore: |
  .venv/
  tests/fixtures/invalid/
