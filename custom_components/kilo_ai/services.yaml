ask:
  name: Ask
  description: Pošle dotaz na Kilo AI Gateway a vrátí odpověď.
  fields:
    prompt:
      name: Dotaz
      description: Text dotazu pro model.
      required: true
      example: "Jak je venku v Praze?"
      selector:
        text:
          multiline: true
    context:
      name: Kontext
      description: Volitelný systémový kontext (např. stav entit, předvolby).
      selector:
        text:
          multiline: true
    max_tokens:
      name: Max tokens
      selector:
        number:
          min: 1
          max: 32768
          mode: box
    temperature:
      name: Temperature
      selector:
        number:
          min: 0
          max: 2
          step: 0.1
          mode: box

list_models:
  name: List models
  description: Vrátí seznam modelů dostupných přes API klíč.
